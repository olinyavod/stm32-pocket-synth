[package]
name = "black_sitizator"
version = "0.1.0"
edition = "2024"

# The pure-logic lib half has no runtime dependencies of its own — it's just
# u32 math and static data. All the embedded crates below are pulled in only
# when building for a bare-metal target.

[target.'cfg(target_os = "none")'.dependencies]
embassy-stm32 = { version = "0.2.0", features = [
    "defmt",
    "stm32f411ce",
    "memory-x",
    "unstable-pac",
    "time-driver-any",
    "exti",
] }
embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
    "task-arena-size-32768",
] }
embassy-time = { version = "0.4.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-sync = { version = "0.6.2", features = ["defmt"] }
embassy-futures = "0.1.1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Pure-logic tests run on the host.
[dev-dependencies]
proptest = "1.5"

[lib]
name = "black_sitizator"
path = "src/lib.rs"

[[bin]]
name = "black_sitizator"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = 2          # keep debuginfo for defmt
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
overflow-checks = true
