[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# probe-rs picks the chip; STM32F411CEUx is BlackPill UFQFPN48.
runner = "probe-rs run --chip STM32F411CEUx"

rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    # flip-link reorders RAM so a stack overflow faults instead of silently
    # corrupting .bss/.data — uncomment after `flip-link` is on PATH (already installed).
    "-C", "linker=flip-link",
]

[env]
DEFMT_LOG = "trace"

# Host-side tests for the pure-logic lib (util, songs). Run with `cargo t`.
# The default `cargo test` would inherit `target = thumbv7em-none-eabihf` from
# the [build] section above — which doesn't link std and so can't run tests.
[alias]
t = "test --target x86_64-pc-windows-msvc --lib"

[unstable]
# Keep build-std off by default; uncomment to compile core/alloc from source.
# build-std = ["core"]
# build-std-features = ["panic_immediate_abort"]
